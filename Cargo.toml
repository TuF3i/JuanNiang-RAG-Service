[package]
name = "JuanNiang-RAG-Service"
version = "0.1.0"
edition = "2024"

[dependencies]
turbovec = "0.9"          # 向量索引（IdMapIndex）
llama-cpp-2 = "0.1"       # llama.cpp 绑定，进程内推理
axum = "0.8"              # HTTP 框架
tokio = { version = "1", features = ["full"] }
anyhow = "1"              # 简易错误处理（main 里用 ?）
tracing = "0.1"           # 日志
tracing-subscriber = "0.3"

# 后续阶段按需加入：serde/serde_json（API 阶段）、bincode（存储层）、
# uuid（tag 类型）、text-splitter（分块）、lru（查询缓存）、thiserror（错误类型）

[dev-dependencies]
rand = "0.8"              # 基准程序生成合成向量用

[profile.release]
lto = true                # 链接时优化：embedding 的 SIMD 代码更优
